<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シルエット試着</title>
<link rel="icon" href="icons/48.png">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/180.png">
<meta name="theme-color" content="#111215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シルエット試着">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>シルエット試着</b><span class="sub">Fitting Room</span></div>
  <div class="top-actions">
    <button type="button" class="btn ghost" data-act="theme" aria-label="表示の明るさを切り替える" title="明るさを切り替え"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    <button type="button" class="btn ghost sync-btn" data-act="sync-open" aria-label="同期とデータ" title="同期とデータ"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg><i class="sync-dot" data-r="sync-dot" hidden></i></button>
    <button type="button" class="btn primary" data-act="save-coord">コーデを保存</button>
  </div>
</header>

<main class="app" data-tab="closet">
  <section class="panel body-panel" data-panel="body" aria-label="からだのサイズ"></section>

  <section class="stage" aria-label="試着ビュー">
    <canvas id="view" aria-label="人型のアバター。ドラッグで回転、ホイールで拡大できます"></canvas>
    <div class="nogl" hidden>このブラウザでは立体表示（WebGL2）が使えません。</div>
    <div class="stage-top">
      <div class="fit-badge" data-r="badge" hidden></div>
    </div>
    <div class="stage-bar" role="toolbar" aria-label="表示">
      <button type="button" class="chip" data-act="measure" aria-pressed="false">採寸モード</button>
      <button type="button" class="chip" data-act="fit" aria-pressed="false">フィット表示</button>
      <button type="button" class="chip icon" data-act="spin" aria-label="くるっと回す" title="くるっと回す"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></svg></button>
      <button type="button" class="chip icon" data-act="reset" aria-label="正面に戻す" title="正面に戻す"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="7" r="3" fill="currentColor"/><path fill="currentColor" d="M7 21v-6a5 5 0 0 1 10 0v6z"/></svg></button>
    </div>
    <div class="legend" data-r="legend" hidden>
      <span><i class="lg-tight"></i>きつい</span><span><i class="lg-snug"></i>ぴったり</span><span><i class="lg-good"></i>ちょうどいい</span><span><i class="lg-loose"></i>ゆったり</span><span><i class="lg-big"></i>大きい</span>
    </div>
    <p class="hint-drag" data-r="hint">ドラッグで回転・ホイールで拡大</p>
    <p class="busy" data-r="busy" role="status" hidden><i></i>布の垂れを計算しています…</p>
  </section>

  <nav class="tabs" role="tablist" aria-label="メニュー">
    <button type="button" role="tab" data-tab="body" class="m-only">からだ</button>
    <button type="button" role="tab" data-tab="closet">クローゼット</button>
    <button type="button" role="tab" data-tab="wear">着ているもの<span class="badge" data-r="wear-count"></span></button>
    <button type="button" role="tab" data-tab="coords">コーデ</button>
  </nav>

  <section class="panel side-panel" aria-live="polite">
    <div data-panel="closet"></div>
    <div data-panel="wear"></div>
    <div data-panel="coords"></div>
    <div class="sheet" data-r="sheet" hidden></div>
  </section>
</main>
<div class="toasts" data-r="toasts" role="status" aria-live="polite"></div>
<dialog class="dlg" data-r="sync-dlg" aria-label="同期とデータ"></dialog>

<script src="core.js"></script>
<script src="sync.js"></script>
<script src="catalog.js"></script>
<script src="design.js"></script>
<script src="cloth.js"></script>
<script src="model.js"></script>
<script src="gl.js"></script>
<script src="studio.js"></script>
</body>
</html>
